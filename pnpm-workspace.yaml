allowBuilds:
  "@google/genai": false
  esbuild: true
  protobufjs: false

# A frozen install refuses day-old releases. The @agntn glob keeps CI green the day a sibling ships.
minimumReleaseAgeExclude:
  - "@agntn/*"

catalogs:
  deps:
    "@agntn/tools": 0.4.0
    "@modelcontextprotocol/server": 2.4.0
  dev:
    "@agntn/ox": 0.1.0
    "@earendil-works/pi-coding-agent": 0.99.2
    "@earendil-works/pi-tui": 0.99.2
    "@modelcontextprotocol/client": 2.4.0
    "@oh-my-pi/pi-coding-agent": 18.20.2
    "@types/node": 25.3.5
    ai: 7.0.181
    obuild: 0.4.45
    oxfmt: 0.79.0
    oxlint: 1.94.0
    oxlint-tsgolint: 7.0.2007
    typescript: 5.9.3
    vitest: 4.1.12

cleanupUnusedCatalogs: true

# Keeps pnpm 12's env document out of the lockfile. GitHub reads that one as zero dependencies.
pmOnFail: ignore
